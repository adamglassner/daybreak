name: Build Linux packages

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "version.properties"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # An older Ubuntu keeps the packages compatible with more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm fakeroot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Read version
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          gradle -p desktop packageDeb packageRpm --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect
        run: |
          mkdir out
          cp desktop/build/compose/binaries/main/deb/*.deb "out/larksong_${V}_amd64.deb"
          cp desktop/build/compose/binaries/main/rpm/*.rpm "out/larksong-${V}.x86_64.rpm"
          ls -la out
          dpkg-deb --info "out/larksong_${V}_amd64.deb"
          rpm -qip "out/larksong-${V}.x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: Larksong-linux
          path: out/

      # One release per version (linux-v1.4.0, …). The app's update button reads these.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "linux-v$V" --yes --cleanup-tag || true
          gh release create "linux-v$V" "out/larksong_${V}_amd64.deb" "out/larksong-${V}.x86_64.rpm" --latest=false \
            --title "Larksong $V for Linux" \
            --notes "Built from ${GITHUB_SHA::7}. Ubuntu, Debian, Mint: larksong_${V}_amd64.deb. Fedora, openSUSE, RHEL: larksong-${V}.x86_64.rpm."

      - name: Save to builds-linux branch
        run: |
          manifest() {
            tag="$1"; title="$2"; shift 2; base="https://github.com/${{ github.repository }}"; list=""
            for f in "$@"; do
              size=$(wc -c < "$f" | tr -d ' ')
              list="$list${list:+,}{\"name\":\"$f\",\"url\":\"$base/releases/download/$tag/$f\",\"size\":$size}"
            done
            printf '{"version":"%s","title":"%s","page":"%s/releases/tag/%s","assets":[%s]}\n' "$V" "$title" "$base" "$tag" "$list" > latest.json
            cat latest.json
          }
          cd out
          manifest "linux-v$V" "Larksong $V for Linux" "larksong_${V}_amd64.deb" "larksong-${V}.x86_64.rpm"
          git init -q -b builds-linux
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Linux packages $V from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-linux

      # If the build fails, keep its log on a branch so it can be read without GitHub's log storage.
      - name: Save failure log
        if: failure()
        shell: bash
        run: |
          mkdir faillog && cp build.log faillog/ 2>/dev/null || echo "no log" > faillog/build.log
          cd faillog
          git init -q -b ci-log-linux
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Failed build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-linux
