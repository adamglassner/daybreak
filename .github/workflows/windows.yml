name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build installer
        run: gradle -p desktop packageExe packageMsi --no-daemon --stacktrace

      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/build/compose/binaries/main/exe/*.exe out/Daybreak-Setup.exe
          cp desktop/build/compose/binaries/main/msi/*.msi out/Daybreak.msi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Daybreak-windows
          path: out/

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows out/Daybreak-Setup.exe out/Daybreak.msi --title "Daybreak for Windows (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Run Daybreak-Setup.exe to install."

      - name: Save to builds-windows branch
        shell: bash
        run: |
          cd out
          git init -q -b builds-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Daybreak-Setup.exe
          git commit -q -m "Installer from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-windows
