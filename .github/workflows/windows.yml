name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "version.properties"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Read version
        shell: bash
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          gradle -p desktop packageExe packageMsi --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/build/compose/binaries/main/exe/*.exe "out/Larksong-Setup-$V.exe"
          cp desktop/build/compose/binaries/main/msi/*.msi "out/Larksong-$V.msi"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Larksong-windows
          path: out/

      # One release per version (windows-v1.2.0, …). The app's update button reads these.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release delete "windows-v$V" --yes --cleanup-tag || true
          gh release create "windows-v$V" "out/Larksong-Setup-$V.exe" "out/Larksong-$V.msi" --latest=false \
            --title "Larksong $V for Windows" \
            --notes "Built from ${GITHUB_SHA::7}. Run Larksong-Setup-$V.exe to install or update, or use Settings → Check for updates in the app."

      - name: Save to builds-windows branch
        shell: bash
        run: |
          cd out
          git init -q -b builds-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "Larksong-Setup-$V.exe"
          git commit -q -m "Installer $V from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-windows

      # If the build fails, keep its log on a branch so it can be read without GitHub's log storage.
      - name: Save failure log
        if: failure()
        shell: bash
        run: |
          mkdir faillog && cp build.log faillog/ 2>/dev/null || echo "no log" > faillog/build.log
          cd faillog
          git init -q -b ci-log-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Failed build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-windows
