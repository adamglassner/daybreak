name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/windows.yml"
      - ".github/workflows/linux.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Read version
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk "Larksong-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Larksong-apk
          path: Larksong-*.apk

      # One release per version (android-v1.2.0, …). The apps' update button reads these.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete "android-v$V" --yes --cleanup-tag || true
          gh release create "android-v$V" "Larksong-$V.apk" --latest=false \
            --title "Larksong $V for Android" \
            --notes "Built from ${GITHUB_SHA::7}. Download Larksong-$V.apk on your phone and open it to install, or use Settings → Check for updates in the app."

      # latest.json tells the app's update button about this version without using GitHub's
      # rate-limited API (read from raw.githubusercontent.com).
      - name: Save to builds branch
        run: |
          manifest() {
            tag="$1"; title="$2"; shift 2; base="https://github.com/${{ github.repository }}"; list=""
            for f in "$@"; do
              size=$(wc -c < "$f" | tr -d ' ')
              list="$list${list:+,}{\"name\":\"$f\",\"url\":\"$base/releases/download/$tag/$f\",\"size\":$size}"
            done
            printf '{"version":"%s","title":"%s","page":"%s/releases/tag/%s","assets":[%s]}\n' "$V" "$title" "$base" "$tag" "$list" > latest.json
            cat latest.json
          }
          manifest "android-v$V" "Larksong $V for Android" "Larksong-$V.apk"
          mkdir out && cp "Larksong-$V.apk" out/Larksong.apk && mv latest.json out/ && cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Larksong.apk latest.json
          git commit -q -m "APK $V from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

      # If the build fails, keep its log on a branch so it can be read without GitHub's log storage.
      - name: Save failure log
        if: failure()
        run: |
          mkdir faillog && (cp build.log faillog/ 2>/dev/null || echo "no log" > faillog/build.log) && cd faillog
          git init -q -b ci-log-android
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Failed build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-android
