name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Daybreak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Daybreak-apk
          path: Daybreak.apk

      # Latest APK as a release: open github.com/<you>/daybreak/releases on your phone and tap Daybreak.apk.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Daybreak.apk --title "Daybreak (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Daybreak.apk on your phone and open it to install."

      # Also keep the APK on a 'builds' branch.
      - name: Save to builds branch
        run: |
          mkdir out && cp Daybreak.apk out/ && cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Daybreak.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
