name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/windows.yml"
      - ".github/workflows/linux.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Read version
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk "Larksong-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Larksong-apk
          path: Larksong-*.apk

      # One release per version (android-v1.2.0, …). The apps' update button reads these.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete "android-v$V" --yes --cleanup-tag || true
          gh release create "android-v$V" "Larksong-$V.apk" --latest=false \
            --title "Larksong $V for Android" \
            --notes "Built from ${GITHUB_SHA::7}. Download Larksong-$V.apk on your phone and open it to install, or use Settings → Check for updates in the app."

      - name: Save to builds branch
        run: |
          mkdir out && cp "Larksong-$V.apk" out/Larksong.apk && cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Larksong.apk
          git commit -q -m "APK $V from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
